<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Screener</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;--up:#12805c;--warn:#b54708;--acc:#2f5fd0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.mk{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.up{color:var(--up)}.dn{color:#b42318}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sym{font-weight:700;font-size:17px}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:#eef3ff;color:var(--acc);margin-left:8px}
.tag.rev{background:#fff4e5;color:var(--warn)}
.tag.exp{background:#fef3f2;color:#b42318}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0 6px}
.k{color:var(--mute);font-size:12px}.v{font-weight:600}
.why{color:var(--mute);font-size:13px}
.res{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.res .ok{color:var(--up);font-weight:600}.res .cau{color:var(--warn);font-weight:600}
.res ul{margin:4px 0 0;padding-left:18px}.res li{margin:2px 0}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#98a2b3;margin-right:6px}
.live.on{background:var(--up);animation:p 2s infinite}@keyframes p{50%{opacity:.3}}
.st{font-weight:600}.st.bad{color:#b42318}.st.ok{color:var(--up)}.st.mid{color:var(--warn)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--mute)}
.notes{margin-top:18px;color:var(--mute);font-size:13px}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Crypto Screener</h1>
  <div class="sub" id="sub">Loading...</div>
  <div class="sub"><span class="live" id="dot"></span><span id="liveTxt">Connecting to live prices...</span></div>
  <div class="mk" id="mk"></div>
  <div class="tabs" id="tabs">
    <button data-f="All" class="on">All</button>
    <button data-f="Breakout">Breakouts</button>
    <button data-f="Reversal">Reversals</button>
  </div>
  <div id="list"></div>
  <h2 style="font-size:16px;margin:22px 0 4px">Watchlist: close to triggering</h2>
  <div class="sub">Not signals. These sit within 3% under their 42 day high. They trigger only on a daily close above it with strong volume.</div>
  <div id="watch"></div>
  <div class="notes" id="notes"></div>
</div>
<script>
let DATA=null,F="All";
const fmt=x=>{const t=Number(x).toPrecision(5);return t.includes(".")&&!t.includes("e")?t.replace(/\.?0+$/,""):String(parseFloat(t))};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function res(s){const r=s.research;if(!r)return"";
  const facts=[r.mcap_musd!=null?`Market cap $${r.mcap_musd}M (rank ${r.rank||"n/a"})`:"",r.circulating_pct!=null?`${r.circulating_pct}% of supply circulating`:"",r.ath_drop_pct!=null?`${r.ath_drop_pct}% below all time high`:""].filter(Boolean).join(" | ");
  const fl=r.flags.map(f=>`<li>${esc(f)}</li>`).join("");
  const nw=(r.news||[]).map(n=>`<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a> <span class="k">${esc(n.source)}</span></li>`).join("");
  return `<div class="res"><span class="${r.flags.length?"cau":"ok"}">${esc(r.verdict)}</span> <span class="k">${esc(facts)}</span>${fl?`<ul>${fl}</ul>`:""}${nw?`<div class="k" style="margin-top:6px">Recent headlines</div><ul>${nw}</ul>`:`<div class="k" style="margin-top:6px">No recent headlines found in the feeds checked.</div>`}</div>`}
const pct=x=>`<span class="${x>=0?"up":"dn"}">${x>=0?"+":""}${x.toFixed(1)}%</span>`;
function render(){
  const d=DATA;
  document.getElementById("sub").textContent=d.generated_utc?`Updated ${d.generated_utc} UTC | scanned ${d.scanned} spot pairs on Binance`:"No scan yet";
  const mk=document.getElementById("mk");mk.innerHTML="";
  for(const k of ["BTC","ETH"]){const m=d.market[k];if(m)mk.innerHTML+=`<div class="pill"><b>${k}</b> ${fmt(m.price)} ${pct(m.chg24h)}</div>`}
  const rows=d.signals.filter(s=>F==="All"||s.type===F);
  const el=document.getElementById("list");
  if(!rows.length){el.innerHTML=`<div class="empty">No clean setups right now. Waiting is a valid position.</div>`}
  else el.innerHTML=rows.map(s=>`<div class="card">
    <div class="top"><div><span class="sym">${s.symbol}</span><span class="tag ${s.type==="Reversal"?"rev":""}">${s.type}</span>${s.experimental?'<span class="tag exp">Experimental</span>':''}</div>
    <div class="k">score ${s.score}</div></div>
    <div class="grid">
      <div><div class="k">Live price</div><div class="v live-px" data-p="${s.pair}">...</div></div>
      <div><div class="k">Status now</div><div class="v st" data-st="${s.pair}">...</div></div>
      <div><div class="k">Price at signal</div><div class="v">${fmt(s.price)}</div></div>
      <div><div class="k">Stop (exit if below)</div><div class="v">${fmt(s.stop)}</div></div>
      <div><div class="k">Sell if daily close below</div><div class="v">${fmt(s.exit_below)}</div></div>
      <div><div class="k">Risk to stop</div><div class="v">${s.risk_pct}%</div></div>
      <div><div class="k">Size for 1% loss</div><div class="v">${s.size_for_1pct_loss}% of capital</div></div>
      <div><div class="k">Volume vs avg</div><div class="v">${s.vol_ratio}x</div></div>
      <div><div class="k">24h</div><div class="v">${pct(s.chg24h)}</div></div>
    </div>
    <div class="why">${s.why} 24h volume $${s.qvol_musd}M.</div>${res(s)}</div>`).join("");
  const w=d.watchlist||[];
  document.getElementById("watch").innerHTML=w.length?w.map(s=>`<div class="card"><div class="top"><span class="sym">${s.symbol}</span><span class="k">${s.gap_pct}% below trigger</span></div>
    <div class="grid"><div><div class="k">Live price</div><div class="v live-px" data-p="${s.pair}">...</div></div>
    <div><div class="k">Status now</div><div class="v st" data-wt="${s.pair}">...</div></div>
    <div><div class="k">Trigger (close above)</div><div class="v">${fmt(s.trigger)}</div></div>
    <div><div class="k">Volume vs avg</div><div class="v">${s.vol_ratio}x</div></div>
    <div><div class="k">24h</div><div class="v">${pct(s.chg24h)}</div></div></div>
    <div class="why">${s.why} 24h volume $${s.qvol_musd}M.</div>${res(s)}</div>`).join(""):`<div class="empty">Nothing close to triggering.</div>`;
  document.getElementById("notes").innerHTML=d.notes.map(n=>`<div>${n}</div>`).join("");
}
document.getElementById("tabs").onclick=e=>{if(e.target.dataset.f){F=e.target.dataset.f;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===e.target));render()}};
function live(){
  const pairs=[...new Set([...(DATA.signals||[]),...(DATA.watchlist||[])].map(x=>x.pair).concat(["BTCUSDT","ETHUSDT"]))];
  fetch("https://data-api.binance.vision/api/v3/ticker/price?symbols="+encodeURIComponent(JSON.stringify(pairs))).then(r=>r.json()).then(a=>{
    const P={};a.forEach(x=>P[x.symbol]=parseFloat(x.price));
    document.querySelectorAll("[data-p]").forEach(el=>{const p=P[el.dataset.p];if(p!=null)el.textContent=fmt(p)});
    (DATA.signals||[]).forEach(s=>{const p=P[s.pair],el=document.querySelector(`[data-st="${s.pair}"]`);if(p==null||!el)return;
      let t,c;if(p<=s.stop){t="Below stop: exit";c="bad"}else if(p<s.exit_below){t="Below sell level: exit if the day closes here";c="mid"}else{t=`${((p/s.price-1)*100).toFixed(1)}% since signal. Hold`;c="ok"}
      el.textContent=t;el.className="v st "+c});
    (DATA.watchlist||[]).forEach(w=>{const p=P[w.pair],el=document.querySelector(`[data-wt="${w.pair}"]`);if(p==null||!el)return;
      const g=(w.trigger/p-1)*100;el.textContent=g<=0?"Above trigger now. Needs a daily close":`${g.toFixed(1)}% below trigger`;el.className="v st "+(g<=0?"mid":"")});
    ["BTC","ETH"].forEach(k=>{const p=P[k+"USDT"];if(p!=null&&DATA.market[k]){DATA.market[k].price=p;}});
    const mk=document.getElementById("mk");mk.innerHTML="";
    for(const k of ["BTC","ETH"]){const m=DATA.market[k];if(m)mk.innerHTML+=`<div class="pill"><b>${k}</b> ${fmt(m.price)} ${pct(m.chg24h)}</div>`}
    document.getElementById("dot").className="live on";
    document.getElementById("liveTxt").textContent="Live prices, updated "+new Date().toLocaleTimeString()+". Signals refresh several times a day.";
  }).catch(()=>{document.getElementById("dot").className="live";document.getElementById("liveTxt").textContent="Live prices unavailable. Showing the last saved scan."});
}
function load(){fetch("signals.json?t="+Date.now()).then(r=>r.json()).then(d=>{DATA=d;render();live()})
 .catch(()=>{document.getElementById("sub").textContent="Could not load signals.json"})}
load();setInterval(()=>{if(DATA)live()},15000);setInterval(load,10*60*1000);
</script>
</body>
</html>
