name: Daily screener
on:
  schedule:
    - cron: "0 4 * * *"   # 08:00 Dubai time, sends the Telegram brief
    - cron: "30 0,8,12,16,20 * * *"   # refresh signals and research, no Telegram
  workflow_dispatch: {}
concurrency:
  group: screener
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 test_screener.py
      - run: python3 screener.py
        env:
          TELEGRAM_TOKEN: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *') && secrets.TELEGRAM_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save signals
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.json
          git commit -m "Update signals" || echo "no change"
          git pull --rebase -X theirs origin main
          git push
